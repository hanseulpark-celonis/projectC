<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Network KPIs</title>
	<style>
		* {
			box-sizing: border-box;
		}

		:root {
			--label-font: clamp(13px, 0.98vw, 21px);
			--value-font: clamp(19px, 2.5vw, 50px);
			--note-font: clamp(11px, 0.84vw, 18px);
			--ink: #12224A;
			--ink-strong: #1E2536;
			--ink-muted: #4B5468;
			--ink-faint: #8890A2;
			--hairline: #E2E8F0;
		}

		body {
			margin: 0;
			padding: 0;
			color: var(--ink-strong);
			background: transparent;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
			-webkit-font-smoothing: antialiased;
			text-rendering: optimizeLegibility;
		}

		.kpi-panel {
			container-type: inline-size;
			padding: 3px 3px 3px;
			background: #fff;
		}

		.kpi-list {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 12px;
			width: 100%;
			min-width: 0;
		}

		.kpi {
			min-width: 0;
			min-height: 96px;
			display: flex;
			flex-direction: column;
			justify-content: flex-start;
			gap: 10px;
			padding: 10px 10px 4px;
			background: #fff;
			border: 1px solid var(--hairline);
			border-radius: 4px;
		}

		.kpi-label {
			margin: 0;
			font-size: var(--label-font);
			font-weight: 400;
			line-height: 1.2;
			color: var(--ink-muted);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.kpi-value {
			margin: 0;
			font-size: var(--value-font);
			font-weight: 400;
			line-height: 1;
			color: var(--ink);
			white-space: nowrap;
			font-variant-numeric: tabular-nums;
		}

		.kpi-reading {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			gap: 4px;
		}

		.kpi-note {
			margin: 0;
			color: var(--ink-faint);
			font-size: var(--note-font);
			line-height: 1.2;
		}

		@container (max-width: 620px) {
			.kpi-panel {
				padding: 8px 8px 4px;
			}

			.kpi {
				min-height: 88px;
				gap: 7px;
				padding: 9px 5px 4px;
			}

			.kpi-label {
				font-size: clamp(11px, 2.4cqw, 15px);
			}

			.kpi-value {
				font-size: clamp(13px, 3.6cqw, 22px);
			}
		}
	</style>
</head>
<body>
	<main class="kpi-panel" aria-label="Network performance metrics">
		<div class="kpi-list">
		<section class="kpi">
			<h2 class="kpi-label">Network COTD</h2>
			<div class="kpi-reading">
				<p class="kpi-value">78 %</p>
				<p class="kpi-note">target 92%</p>
			</div>
		</section>
		<section class="kpi">
			<h2 class="kpi-label">Plants On Track</h2>
			<p class="kpi-value">19 / 34</p>
		</section>
		<section class="kpi">
			<h2 class="kpi-label">Backlog At Risk</h2>
			<p class="kpi-value">228M €</p>
		</section>
		<section class="kpi">
			<h2 class="kpi-label">Open Order Backlog</h2>
			<p class="kpi-value">45.1B €</p>
		</section>
		</div>
	</main>
</body>
</html>

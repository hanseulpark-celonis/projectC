<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Network KPIs</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			color: #202020;
			background: #fff;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
		}

		.kpi-list {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			width: 100%;
			padding: 12px 0 19px;
		}

		.kpi {
			min-width: 0;
			min-height: 102px;
			padding: 0 16px;
			border-right: 2px solid #e6e6e6;
		}

		.kpi:last-child {
			border-right: 0;
		}

		.kpi-label {
			margin: 0 0 9px;
			font-size: 26px;
			font-weight: 300;
			line-height: 1.15;
		}

		.kpi-value {
			margin: 0;
			font-size: 56px;
			font-weight: 300;
			line-height: 1;
			white-space: nowrap;
		}

		.kpi-reading {
			display: inline-flex;
			flex-direction: column;
			align-items: center;
		}

		.kpi-note {
			margin: 4px 0 0;
			color: #999;
			font-size: 16px;
			line-height: 1.2;
		}

		@media (max-width: 720px) {
			.kpi-list {
				grid-template-columns: repeat(2, minmax(0, 1fr));
				padding: 8px 0;
			}

			.kpi {
				min-height: 94px;
				padding: 10px 14px;
				border-bottom: 1px solid #e6e6e6;
			}

			.kpi:nth-child(2) {
				border-right: 0;
			}

			.kpi:nth-last-child(-n + 2) {
				border-bottom: 0;
			}

			.kpi-label {
				margin-bottom: 8px;
				font-size: 17px;
			}

			.kpi-value {
				font-size: 38px;
			}

			.kpi-note {
				font-size: 12px;
			}
		}

		@media (max-width: 360px) {
			.kpi {
				padding-right: 8px;
				padding-left: 8px;
			}

			.kpi-label {
				font-size: 15px;
			}

			.kpi-value {
				font-size: 32px;
			}
		}
	</style>
</head>
<body>
	<main class="kpi-list" aria-label="Network performance metrics">
		<section class="kpi">
			<h2 class="kpi-label">Network COTD</h2>
			<div class="kpi-reading">
				<p class="kpi-value">78 %</p>
				<p class="kpi-note">target 92%</p>
			</div>
		</section>
		<section class="kpi">
			<h2 class="kpi-label">Plants On Track</h2>
			<p class="kpi-value">19 / 34</p>
		</section>
		<section class="kpi">
			<h2 class="kpi-label">Backlog At Risk</h2>
			<p class="kpi-value">228M €</p>
		</section>
		<section class="kpi">
			<h2 class="kpi-label">Open Order Backlog</h2>
			<p class="kpi-value">45.1B €</p>
		</section>
	</main>
</body>
</html>

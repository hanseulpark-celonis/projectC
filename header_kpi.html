<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Grid Technologies | Production &amp; Supply Control Tower</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: #fff;
			color: #142943;
			font-family: Arial, Helvetica, sans-serif;
		}

		.control-tower-header {
			position: relative;
			min-height: 306px;
			padding: 42px 48px 26px;
			border-bottom: 1px solid #e4e7eb;
		}

		.heading {
			padding-right: 270px;
		}

		.heading h1 {
			margin: 0;
			color: #142943;
			font-size: 34px;
			font-weight: 700;
			line-height: 1.2;
		}

		.heading p {
			margin: 8px 0 0;
			color: #788393;
			font-size: 26px;
			line-height: 1.3;
		}

		.company-logo {
			position: absolute;
			top: 118px;
			right: 54px;
			display: block;
			width: 220px;
			height: auto;
		}

		.metrics {
			display: grid;
			grid-template-columns: 180px 208px 210px 250px;
			gap: 38px;
			margin-top: 34px;
		}

		.metric-label {
			margin: 0 0 4px;
			color: #586c83;
			font-size: 19px;
			font-weight: 700;
			line-height: 1.2;
			white-space: nowrap;
		}

		.metric-value {
			margin: 0;
			color: #142943;
			font-size: 46px;
			font-weight: 700;
			line-height: 1.15;
			white-space: nowrap;
		}

		.metric-value.alert {
			color: #d34a3b;
		}

		.metric-value.warning {
			color: #c48916;
		}

		.metric-note {
			margin: 3px 0 0;
			color: #788393;
			font-size: 18px;
			line-height: 1.2;
		}

		@media (max-width: 1100px) {
			.control-tower-header {
				min-height: 143px;
				padding: 26px 22px 12px;
			}

			.heading {
				padding-right: 140px;
			}

			.heading h1 {
				font-size: 16px;
			}

			.heading p {
				margin-top: 3px;
				font-size: 12px;
			}

			.metrics {
				grid-template-columns: repeat(4, max-content);
				gap: 24px;
				margin-top: 15px;
				padding-right: 130px;
			}

			.metric-label {
				margin-bottom: 2px;
				font-size: 9px;
			}

			.metric-value {
				font-size: 20px;
			}

			.metric-note {
				margin-top: 1px;
				font-size: 10px;
			}

			.company-logo {
				top: 58px;
				right: 22px;
				width: 100px;
			}
		}

		@media (max-width: 850px) and (min-width: 721px) {
			.metrics {
				grid-template-columns: repeat(2, max-content);
				gap: 14px 30px;
			}
		}

		@media (max-width: 720px) {
			.control-tower-header {
				min-height: 0;
				padding: 28px 24px;
			}

			.heading {
				padding-right: 0;
			}

			.heading h1 {
				max-width: 520px;
				font-size: 21px;
			}

			.heading p {
				max-width: 560px;
				font-size: 14px;
			}

			.company-logo {
				position: static;
				width: 130px;
				margin: 14px 0 0 auto;
			}

			.metrics {
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 24px 18px;
				margin-top: 30px;
				padding-right: 0;
			}

			.metric-label {
				font-size: 11px;
			}

			.metric-value {
				font-size: 24px;
			}

			.metric-note {
				font-size: 13px;
			}
		}
	</style>
</head>
<body>
	<header class="control-tower-header">
		<div class="heading">
			<h1>Grid Technologies — Production &amp; Supply Control Tower</h1>
			<p>34 plants · Order-to-Delivery · Committed On-Time Delivery (COTD) against a €45.1B backlog</p>
		</div>

		<img class="company-logo" src="siemens_energy_logo.svg.png" alt="Siemens Energy">

		<section class="metrics" aria-label="Network performance metrics">
			<div class="metric">
				<p class="metric-label">Network COTD</p>
				<p class="metric-value alert">78%</p>
				<p class="metric-note">target 92%</p>
			</div>
			<div class="metric">
				<p class="metric-label">Plants on track</p>
				<p class="metric-value">19 / 34</p>
			</div>
			<div class="metric">
				<p class="metric-label">Backlog at risk</p>
				<p class="metric-value warning">€228M</p>
			</div>
			<div class="metric">
				<p class="metric-label">Open order backlog</p>
				<p class="metric-value">€45.1B</p>
			</div>
		</section>
	</header>
</body>
</html>
